name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply pending age 17-20 UI fix
        if: ${{ hashFiles('scripts/fix_age1720_main.py') != '' }}
        run: |
          python3 scripts/fix_age1720_main.py
          git config user.name "Yamone English Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: integrate age 17-20 course in home flow"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run catalog integrity tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-english-debug
          path: app/build/outputs/apk/debug/app-debug.apk
