name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit and regression tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Build unsigned release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Sanity-check release artifacts
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_AAB="app/build/outputs/bundle/release/app-release.aab"

          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          test -s "$RELEASE_AAB"

          BADGING="$($AAPT dump badging "$RELEASE_APK")"
          printf '%s\n' "$BADGING"

          grep -Fq "package: name='com.yamone.english' versionCode='33' versionName='0.8.5'" <<<"$BADGING"
          grep -Fq "sdkVersion:'26'" <<<"$BADGING"
          grep -Fq "targetSdkVersion:'36'" <<<"$BADGING"
          grep -Fq "uses-permission: name='android.permission.RECORD_AUDIO'" <<<"$BADGING"

          if grep -Fq "android.permission.INTERNET" <<<"$BADGING"; then
            echo "Unexpected INTERNET permission in release APK" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-english-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release outputs
        uses: actions/upload-artifact@v4
        with:
          name: yamone-english-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
