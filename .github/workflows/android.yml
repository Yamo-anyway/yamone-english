name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.7.1 source patch
        run: python3 tools/apply_v071.py

      - name: Commit source patch if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "yamone-ci"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/java/com/yamone/english/MainActivity.kt app/src/main/java/com/yamone/english/Age1720ExpansionCatalog.kt
            git commit -m "feat: wire age 17-20 assessment and quality fixes"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run catalog integrity tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yamone-english-debug
          path: app/build/outputs/apk/debug/app-debug.apk
