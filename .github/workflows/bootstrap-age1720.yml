name: Bootstrap age 17-20

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/apply_age1720.py"
      - ".github/workflows/bootstrap-age1720.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'feat: add age 17-20 course lessons 1-50') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply age 17-20 catalog changes
        run: python3 scripts/apply_age1720.py

      - name: Commit generated course
        run: |
          git config user.name "Yamone English Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add age 17-20 course lessons 1-50"
          git push origin HEAD:main
